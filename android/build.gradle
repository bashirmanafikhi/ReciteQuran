// android/build.gradle — react-native-recite-quran
//
// ─── sherpa-onnx dependency (Task 11 gate; full evidence in task-11-report.md) ───
//
//   Dart dependency ...... sherpa_onnx 1.13.6 (pubspec.lock)
//   Native version ....... sherpa-onnx v1.13.6 — the Dart Android packages are stamped
//                          with the *same* string as the native project, upstream
//                          new-release.sh writes CMakeLists.txt's SHERPA_ONNX_VERSION
//                          into flutter/sherpa_onnx_android_arm64/pubspec.yaml.
//                          Tag v1.13.6 has set(SHERPA_ONNX_VERSION "1.13.6").
//   Maven Central ........ NO sherpa-onnx artifact exists
//                          (search.maven.org "g:com.k2fsa.sherpa" -> numFound=0).
//                          → provider deviation, see report §2.
//   Provider used ........ JitPack, the coordinate the project's own jitpack.yml
//                          (tag v1.13.6) installs the official release AAR under:
//                          com.github.k2-fsa.sherpa-onnx:sherpa-onnx:1.13.6 (packaging=aar)
//   Byte-identical ....... sha256 0012d9a28f15bd6fb966b62b70a75da3990512fdccce28b83098248ce4be1698
//                          for both the JitPack artifact and
//                          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-1.13.6.aar
//
// The AAR is the *shared* onnxruntime build (jni/<abi>/libonnxruntime.so + libsherpa-onnx-jni.so),
// which is exactly what the Dart/Flutter build linked against
// (build-android-arm64-v8a.sh defaults BUILD_SHARED_LIBS=ON, onnxruntime 1.27.1), so the
// decoded output stays comparable with the original app.

buildscript {
    // Only required when this module is opened standalone. When it is consumed as an
    // autolinked React Native library the host application already supplies both plugins.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath "com.android.tools.build:gradle:8.1.4"
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// assets/ of the published npm package (package.json "files" ships assets/model/tokens.txt).
// Exposed through the AAR so ReciteQuranModule can extract it with AssetManager.
def npmAssetsDir = file("$projectDir/../assets")

android {
    // AGP 7.3+ prefers `namespace`; keeping `package` out of the manifest keeps both
    // old and new AGP happy (AGP 8 rejects `package` in AndroidManifest.xml).
    if (project.android.hasProperty("namespace")) {
        namespace "com.recitequran"
    }

    compileSdkVersion safeExtGet("compileSdkVersion", 34)

    defaultConfig {
        // sherpa-onnx 1.13.6's own AAR declares <uses-sdk android:minSdkVersion="21" />
        // and is built with SHERPA_ONNX_ANDROID_PLATFORM=android-21.
        minSdkVersion safeExtGet("minSdkVersion", 21)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)
        consumerProguardFiles "proguard-rules.pro"
    }

    compileOptions {
        // Java 17, not 1.8: React Native's JdkConfiguratorUtils forces the Java
        // side of every module to 17, and a 1.8 Kotlin target against a 17 Java
        // target fails the module with "Inconsistent JVM-target compatibility".
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            if (npmAssetsDir.exists()) {
                assets.srcDirs += npmAssetsDir
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    // Hosts using settings.gradle dependencyResolutionManagement with
    // RepositoriesMode.FAIL_ON_PROJECT_REPOS must add jitpack.io there as well.
    maven { url = uri("https://jitpack.io") }
}

// Hosts that already ship com.k2fsa.sherpa.onnx.* — e.g. via react-native-sherpa-onnx —
// set reciteQuranExternalSherpa=true in gradle.properties. The module then compiles
// against the SDK's extracted classes and leaves packaging them to the SDK, instead of
// adding the JitPack AAR (two copies of the classes fail dexing with
// "Duplicate class com.k2fsa.sherpa.onnx.AudioEvent").
def useExternalSherpa = project.findProperty("reciteQuranExternalSherpa") == "true"

dependencies {
    implementation "com.facebook.react:react-android"

    if (useExternalSherpa) {
        // compileOnly, not implementation: the classes are needed to compile this
        // module's `import com.k2fsa.sherpa.onnx.*`, but must not be packaged again
        // here — the host's sherpa-onnx SDK already contributes them to the APK.
        // The SDK declares them as `implementation`, so they are not visible to
        // other modules and have to be named explicitly.
        compileOnly files("$rootDir/../node_modules/react-native-sherpa-onnx/android/build/sherpa-onnx-classes/classes.jar")
    } else {
        implementation "com.github.k2-fsa.sherpa-onnx:sherpa-onnx:1.13.6"
    }
}

// The classes.jar above is a *task output* of the SDK's extractSherpaOnnxClasses, so
// consuming it without declaring the relationship makes Gradle fail with "uses
// this output of task ... without declaring an explicit or implicit dependency".
// Ordering the compile tasks after the extraction keeps a clean build correct.
// The dependency is declared as a STRING task path: paths are resolved when the
// task graph is built, while findByName() would need the SDK project configured
// right now — under Expo's --configure-on-demand it isn't, so the lookup would
// return null and the fix would silently never apply.
afterEvaluate {
    if (useExternalSherpa && rootProject.findProject(':react-native-sherpa-onnx') != null) {
        def sherpaClassesJar = "$rootDir/../node_modules/react-native-sherpa-onnx/android/build/sherpa-onnx-classes/classes.jar"
        tasks.withType(JavaCompile).configureEach { t ->
            t.dependsOn ':react-native-sherpa-onnx:extractSherpaOnnxClasses'
            t.inputs.file(sherpaClassesJar)
        }
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { t ->
            t.dependsOn ':react-native-sherpa-onnx:extractSherpaOnnxClasses'
        }
    }
}
